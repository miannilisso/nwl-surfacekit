allowBuilds:
  sharp: true
  unrs-resolver: true
  msw: false
  esbuild: true
  core-js-pure: false
  "@swc/core": true
  "@parcel/watcher": false

# eslint-plugin-react 7.37.5 predates ESLint 10 peer metadata. The shared
# config wraps it with @eslint/compat, and the full lint suite validates this
# exact combination. Remove this exception when the plugin declares ESLint 10.
peerDependencyRules:
  allowedVersions:
    "eslint-plugin-react@7.37.5>eslint": "10"

overrides:
  "brace-expansion@>=4.0.0 <5.0.9": "5.0.9"
  "fast-uri@>=3.0.0 <3.1.5": "3.1.5"
  "hono@<4.12.34": "4.13.4"
  "js-yaml@>=4.0.0 <4.3.1": "4.3.1"
  "nanoid@<3.3.18": "3.3.18"
  "recharts@3.10.1>react-is": "19.3.0"
  "use-sync-external-store": "1.7.0"

minimumReleaseAgeExclude:
  - lucide-react@1.47.0
  - "@playwright/test@1.63.0"
  - playwright-core@1.63.0
  - playwright@1.63.0
  - "@next/env@16.3.6"
