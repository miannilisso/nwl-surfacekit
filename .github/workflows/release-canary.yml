name: SurfaceKit Canary

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nwl/surfacekit build
      - run: mkdir -p artifacts && pnpm --filter @nwl/surfacekit pack --pack-destination ./artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: surfacekit-canary-tarball
          path: artifacts/*.tgz
          if-no-files-found: error
