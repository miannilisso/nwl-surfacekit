name: Release SurfaceKit 1.0

on:
  push:
    tags:
      - surfacekit-v1.0.0

permissions: {}

concurrency:
  group: release-surfacekit-v1.0.0
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the versioned tag on main
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/tags/surfacekit-v1.0.0
          version="${GITHUB_REF_NAME#surfacekit-v}"
          test "$version" = 1.0.0
          test "$(jq -r .version packages/ui/package.json)" = "$version"
          commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          test "$(git rev-parse HEAD)" = "$commit"
          git merge-base --is-ancestor "$commit" origin/main
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Require protected main, required verification, and immutable releases
        env:
          GH_TOKEN: ${{ secrets.RELEASE_POLICY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          protection="$(gh api "repos/$GITHUB_REPOSITORY/branches/main/protection")"
          jq -e '[.required_status_checks.contexts[]?, .required_status_checks.checks[]?.context] | index("verification-required") != null' <<< "$protection"
          gh api "repos/$GITHUB_REPOSITORY/immutable-releases" --jq '.enabled' | grep -qx true
      - name: Require a green main push workflow with real jobs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_COMMIT: ${{ steps.identity.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          runs="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/verify.yml/runs" -f head_sha="$TAG_COMMIT" -f branch=main -f event=push -f per_page=100)"
          run_id="$(jq -er --arg sha "$TAG_COMMIT" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and .event == "push")] | sort_by(.created_at) | last | select(.status == "completed" and .conclusion == "success") | .id' <<< "$runs")"
          jobs="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs" -f per_page=100)"
          jq -e 'any(.jobs[]; .name == "verification-required" and .status == "completed" and .conclusion == "success")' <<< "$jobs"

  build:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          version: 12.5.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:production-licenses && pnpm check:attributions
      - run: pnpm --filter @nwl/surfacekit build
      - name: Pack exactly once and record its SHA-256
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          (cd packages/ui && pnpm pack --pack-destination ../../release --json)
          set -- release/*.tgz
          test "$#" -eq 1
          digest="$(sha256sum "$1" | cut -d ' ' -f1)"
          node scripts/verify-release-artifact.mjs "$1" "$digest" "$RELEASE_VERSION"
          (cd release && sha256sum ./*.tgz > SHA256SUMS)
          node scripts/generate-release-sboms.mjs "$1" "$RELEASE_VERSION" release
          test -f CHANGELOG.md
          cp CHANGELOG.md release/CHANGELOG.md
      - name: Attest the tarball build
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*.tgz
      - name: Attest the SPDX SBOM
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*.tgz
          sbom-path: release/sbom.spdx.json
      - name: Include signed provenance with the release assets
        env:
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_ATTESTATION: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE" release/provenance.bundle.json
          cp "$SBOM_ATTESTATION" release/sbom-attestation.bundle.json
      - name: Transfer the verified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: surfacekit-v1.0.0-candidate
          path: release/
          if-no-files-found: error
          retention-days: 14

  consumers:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          version: 12.5.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: surfacekit-v1.0.0-candidate
          path: release/
      - name: Verify transfer, manifest, and both installed consumers
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          (cd release && sha256sum -c SHA256SUMS)
          set -- release/*.tgz
          test "$#" -eq 1
          digest="$(sha256sum "$1" | cut -d ' ' -f1)"
          node scripts/verify-release-artifact.mjs "$1" "$digest" "$RELEASE_VERSION"
          SURFACEKIT_RELEASE_TARBALL="$1" SURFACEKIT_RELEASE_SHA256="$digest" node tests/consumers/run.mjs

  publish:
    needs: [preflight, build, consumers]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: surfacekit-v1-release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      TAG_COMMIT: ${{ needs.preflight.outputs.commit }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: surfacekit-v1.0.0-candidate
          path: release/
      - name: Verify the candidate before release access
        shell: bash
        run: |
          set -euo pipefail
          (cd release && sha256sum -c SHA256SUMS)
          set -- release/*.tgz
          test "$#" -eq 1
          test -s release/sbom.spdx.json
          test -s release/sbom.cdx.json
          test -s release/provenance.bundle.json
          test -s release/sbom-attestation.bundle.json
          test -s release/CHANGELOG.md
      - name: Recheck immutable release policy
        env:
          GH_TOKEN: ${{ secrets.RELEASE_POLICY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh api "repos/$GITHUB_REPOSITORY/immutable-releases" --jq '.enabled' | grep -qx true
      - name: Create a draft with every verified asset
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists: $TAG" >&2
            exit 1
          fi
          gh release create "$TAG" release/* --draft --verify-tag --target "$TAG_COMMIT" --title "$TAG" --notes-file release/CHANGELOG.md
          set -- release/*.tgz
          tarball="$(basename "$1")"
          digest="$(sha256sum "$1" | cut -d ' ' -f1)"
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          jq -e --arg name "$tarball" --arg digest "sha256:$digest" '.draft == true and any(.assets[]; .name == $name and .digest == $digest)' <<< "$release_json"
          for asset in "$tarball" SHA256SUMS sbom.spdx.json sbom.cdx.json provenance.bundle.json sbom-attestation.bundle.json CHANGELOG.md; do
            jq -e --arg name "$asset" 'any(.assets[]; .name == $name and .state == "uploaded")' <<< "$release_json"
          done
          mkdir -p draft-verify
          gh release download "$TAG" --pattern "$tarball" --dir draft-verify
          test "$(sha256sum "draft-verify/$tarball" | cut -d ' ' -f1)" = "$digest"
      - name: Publish and verify the downloaded immutable asset
        shell: bash
        run: |
          set -euo pipefail
          set -- release/*.tgz
          tarball="$(basename "$1")"
          digest="$(sha256sum "$1" | cut -d ' ' -f1)"
          gh release edit "$TAG" --draft=false
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.immutable')" = true
          mkdir -p published-verify
          gh release download "$TAG" --pattern "$tarball" --dir published-verify
          test "$(sha256sum "published-verify/$tarball" | cut -d ' ' -f1)" = "$digest"
