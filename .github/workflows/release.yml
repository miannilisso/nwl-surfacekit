name: Release SurfaceKit 1.0

on:
  push:
    tags:
      - surfacekit-v1.0.0

permissions: {}

concurrency:
  group: release-surfacekit-v1.0.0
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the versioned tag on main
        id: identity
        run: node scripts/check-release-gates.mjs identity
      - name: Require protected main, required verification, and immutable releases
        env:
          GH_TOKEN: ${{ secrets.RELEASE_POLICY_TOKEN }}
        run: node scripts/check-release-gates.mjs policy
      - name: Require a green main push workflow with real jobs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_COMMIT: ${{ steps.identity.outputs.commit }}
        run: node scripts/check-release-gates.mjs verification

  build:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.9.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:production-licenses && pnpm check:attributions
      - run: pnpm --filter @nwl/surfacekit build
      - name: Pack exactly once and record its SHA-256
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          (cd packages/ui && pnpm pack --pack-destination ../../release --json)
          set -- release/*.tgz
          test "$#" -eq 1
          digest="$(sha256sum "$1" | cut -d ' ' -f1)"
          node scripts/verify-release-artifact.mjs "$1" "$digest" "$RELEASE_VERSION"
          (cd release && sha256sum ./*.tgz > SHA256SUMS)
          node scripts/generate-release-sboms.mjs "$1" "$RELEASE_VERSION" release
          test -f CHANGELOG.md
          cp CHANGELOG.md release/CHANGELOG.md
      - name: Attest the tarball build
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*.tgz
      - name: Attest the SPDX SBOM
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*.tgz
          sbom-path: release/sbom.spdx.json
      - name: Include signed provenance with the release assets
        env:
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_ATTESTATION: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE" release/provenance.bundle.json
          cp "$SBOM_ATTESTATION" release/sbom-attestation.bundle.json
      - name: Transfer the verified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: surfacekit-v1.0.0-candidate
          path: release/
          if-no-files-found: error
          retention-days: 14

  consumers:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.9.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: surfacekit-v1.0.0-candidate
          path: release/
      - name: Verify transfer, manifest, and both installed consumers
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          (cd release && sha256sum -c SHA256SUMS)
          set -- release/*.tgz
          test "$#" -eq 1
          digest="$(sha256sum "$1" | cut -d ' ' -f1)"
          node scripts/verify-release-artifact.mjs "$1" "$digest" "$RELEASE_VERSION"
          SURFACEKIT_RELEASE_TARBALL="$1" SURFACEKIT_RELEASE_SHA256="$digest" node tests/consumers/run.mjs

  publish:
    needs: [preflight, build, consumers]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: surfacekit-v1-release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      TAG_COMMIT: ${{ needs.preflight.outputs.commit }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: surfacekit-v1.0.0-candidate
          path: release/
      - name: Verify the candidate before release access
        shell: bash
        run: |
          set -euo pipefail
          (cd release && sha256sum -c SHA256SUMS)
          set -- release/*.tgz
          test "$#" -eq 1
          test -s release/sbom.spdx.json
          test -s release/sbom.cdx.json
          test -s release/provenance.bundle.json
          test -s release/sbom-attestation.bundle.json
          test -s release/CHANGELOG.md
      - name: Recheck immutable release and tag protection
        env:
          GH_TOKEN: ${{ secrets.RELEASE_POLICY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          protection="$(gh api "repos/$GITHUB_REPOSITORY/branches/main/protection")"
          jq -e '
            (
              [
                (.required_status_checks.contexts // [])[],
                (.required_status_checks.checks // [])[]?.context
              ] | index("verification-required")
            ) != null and
            (.required_pull_request_reviews | type == "object") and
            (.required_pull_request_reviews.dismiss_stale_reviews == true) and
            (
              .required_pull_request_reviews.required_approving_review_count |
              type == "number" and . >= 1 and floor == .
            ) and
            (
              (.required_pull_request_reviews.bypass_pull_request_allowances // {
                users: [], teams: [], apps: []
              }) |
              type == "object" and
              (.users | type == "array" and length == 0) and
              (.teams | type == "array" and length == 0) and
              (.apps | type == "array" and length == 0)
            ) and
            (.required_conversation_resolution.enabled == true) and
            (.enforce_admins.enabled == true) and
            (.required_linear_history.enabled == true) and
            (.allow_force_pushes.enabled == false) and
            (.allow_deletions.enabled == false)
          ' <<< "$protection" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/immutable-releases" --jq '.enabled' | grep -qx true
          rulesets="$(gh api "repos/$GITHUB_REPOSITORY/rulesets?targets=tag&includes_parents=true&per_page=100")"
          tag_ref="refs/tags/$TAG"
          tag_protected=false
          for ruleset_id in $(jq -r '.[].id' <<< "$rulesets"); do
            ruleset="$(gh api "repos/$GITHUB_REPOSITORY/rulesets/$ruleset_id")"
            if jq -e --arg ref "$tag_ref" '
              .target == "tag" and
              .enforcement == "active" and
              ((.conditions.ref_name.include // []) | any(. == "~ALL" or . == $ref)) and
              ((.conditions.ref_name.exclude // []) | length == 0) and
              (.bypass_actors | type == "array" and length == 0) and
              (([.rules[]?.type] | index("update")) != null) and
              (([.rules[]?.type] | index("deletion")) != null)
            ' <<< "$ruleset"; then
              tag_protected=true
              break
            fi
          done
          test "$tag_protected" = true
      - name: Create a draft with every verified asset
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists: $TAG" >&2
            exit 1
          fi
          tag_ref="$(jq -rn --arg ref "tags/$TAG" '$ref | @uri')"
          remote_tag_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag_ref" --jq '.sha')"
          if [ "$remote_tag_commit" != "$TAG_COMMIT" ]; then
            echo "remote tag moved before draft creation" >&2
            exit 1
          fi
          gh release create "$TAG" release/* --draft --verify-tag --target "$TAG_COMMIT" --title "$TAG" --notes-file release/CHANGELOG.md
          set -- release/*.tgz
          tarball="$(basename "$1")"
          digest="$(sha256sum "$1" | cut -d ' ' -f1)"
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          jq -e --arg name "$tarball" --arg digest "sha256:$digest" '.draft == true and any(.assets[]; .name == $name and .digest == $digest)' <<< "$release_json"
          for asset in "$tarball" SHA256SUMS sbom.spdx.json sbom.cdx.json provenance.bundle.json sbom-attestation.bundle.json CHANGELOG.md; do
            jq -e --arg name "$asset" 'any(.assets[]; .name == $name and .state == "uploaded")' <<< "$release_json"
          done
          mkdir -p draft-verify
          gh release download "$TAG" --pattern "$tarball" --dir draft-verify
          test "$(sha256sum "draft-verify/$tarball" | cut -d ' ' -f1)" = "$digest"
      - name: Publish and verify the downloaded immutable asset
        shell: bash
        run: |
          set -euo pipefail
          set -- release/*.tgz
          tarball="$(basename "$1")"
          digest="$(sha256sum "$1" | cut -d ' ' -f1)"
          tag_ref="$(jq -rn --arg ref "tags/$TAG" '$ref | @uri')"
          remote_tag_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag_ref" --jq '.sha')"
          if [ "$remote_tag_commit" != "$TAG_COMMIT" ]; then
            echo "remote tag moved before publication" >&2
            exit 1
          fi
          gh release edit "$TAG" --draft=false
          released_tag_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag_ref" --jq '.sha')"
          if [ "$released_tag_commit" != "$TAG_COMMIT" ]; then
            echo "released tag identity changed" >&2
            exit 1
          fi
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          jq -e --arg tag "$TAG" '.tag_name == $tag and .draft == false and .immutable == true' <<< "$release_json"
          mkdir -p published-verify
          gh release download "$TAG" --pattern "$tarball" --dir published-verify
          test "$(sha256sum "published-verify/$tarball" | cut -d ' ' -f1)" = "$digest"
